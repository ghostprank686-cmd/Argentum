name: Build Argentum APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

      - name: Instalar Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer setuptools "cython==0.29.34"

      - name: Preparar Buildozer
        run: |
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i 's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
          elif grep -q "^# *android.accept_sdk_license" buildozer.spec; then
            sed -i 's/^# *android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          echo "Configuración SDK:"
          grep "android.accept_sdk_license" buildozer.spec

      - name: Limpiar Buildozer
        run: |
          rm -rf ~/.buildozer

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Verificar APK
        run: |
          echo "APK generado:"
          ls -lh bin/*.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Argentum-APK
          path: bin/*.apk
